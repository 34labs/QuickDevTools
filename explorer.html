<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --win7-blue: #2B579A;
            --win7-blue-light: #3A6EA5;
            --win7-blue-dark: #1E3F6F;
            --win7-glass: rgba(180, 210, 240, 0.45);
            --win7-bg: #F1F1F1;
            --win7-sidebar: #E8EFF5;
            --win7-sidebar-header: #D6E4F0;
            --win7-border: #ADB8C6;
            --win7-selected: #3399FF;
            --win7-selected-text: #FFFFFF;
            --win7-hover: #E8F0FE;
            --win7-toolbar: #F5F5F5;
            --win7-address-bg: #FFFFFF;
            --win7-separator: #C5D1DE;
            --win7-text: #1A1A1A;
            --win7-text-muted: #5A5A5A;
            --win7-status: #E8EFF5;
            --win7-title-text: #FFFFFF;
            --win7-folder: #F0C846;
            --win7-folder-shadow: #D4A830;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a3a5c 0%, #2B579A 30%, #1E4D8C 50%, #3A6EA5 70%, #1a3a5c 100%);
            background-size: 400% 400%;
            animation: bgShift 20s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes bgShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* === WINDOW CONTAINER === */
        .window {
            width: 95%;
            max-width: 1100px;
            height: 85vh;
            max-height: 720px;
            min-height: 500px;
            border-radius: 8px 8px 4px 4px;
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.3),
                0 8px 32px rgba(0,0,0,0.5),
                0 2px 8px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* === TITLE BAR === */
        .titlebar {
            height: 30px;
            background: linear-gradient(180deg, 
                rgba(180,210,240,0.7) 0%, 
                rgba(120,170,220,0.5) 40%,
                rgba(80,140,200,0.4) 100%
            );
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px 0 10px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            user-select: none;
            flex-shrink: 0;
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .titlebar-icon {
            width: 16px;
            height: 16px;
        }

        .titlebar-text {
            font-size: 12px;
            color: var(--win7-title-text);
            text-shadow: 0 0 6px rgba(0,0,0,0.6);
            font-weight: 400;
        }

        .titlebar-controls {
            display: flex;
            height: 100%;
        }

        .titlebar-btn {
            width: 28px;
            height: 20px;
            border: none;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            margin-top: 5px;
        }

        .titlebar-btn svg {
            width: 10px;
            height: 10px;
            stroke: var(--win7-title-text);
            stroke-width: 1.5;
            fill: none;
            filter: drop-shadow(0 0 2px rgba(0,0,0,0.5));
        }

        .titlebar-btn.minimize { border-radius: 2px 0 0 2px; }
        .titlebar-btn.maximize { border-radius: 0; }
        .titlebar-btn.close { border-radius: 0 2px 2px 0; margin-right: 3px; }

        .titlebar-btn.close:hover {
            background: linear-gradient(180deg, #E04343, #C62828);
        }
        .titlebar-btn.minimize:hover,
        .titlebar-btn.maximize:hover {
            background: rgba(255,255,255,0.25);
        }

        /* === NAV TOOLBAR === */
        .nav-toolbar {
            height: 36px;
            background: var(--win7-toolbar);
            border-bottom: 1px solid var(--win7-separator);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 4px;
            flex-shrink: 0;
        }

        .nav-btn {
            width: 28px;
            height: 26px;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #445;
            font-size: 12px;
            transition: all 0.1s;
        }

        .nav-btn:hover:not(:disabled) {
            border-color: #B8CCE0;
            background: linear-gradient(180deg, #FFFFFF, #E8F0FC);
            box-shadow: 0 0 2px rgba(0,0,0,0.1);
        }

        .nav-btn:active:not(:disabled) {
            background: linear-gradient(180deg, #C4D8EC, #A8C4DE);
        }

        .nav-btn:disabled {
            color: #BBB;
            cursor: default;
        }

        .nav-separator {
            width: 1px;
            height: 20px;
            background: var(--win7-separator);
            margin: 0 4px;
        }

        /* === ADDRESS BAR === */
        .address-bar {
            height: 32px;
            background: var(--win7-toolbar);
            border-bottom: 1px solid var(--win7-separator);
            display: flex;
            align-items: center;
            padding: 0 8px;
            gap: 6px;
            flex-shrink: 0;
        }

        .address-label {
            font-size: 11px;
            color: var(--win7-text-muted);
            white-space: nowrap;
        }

        .address-input-wrapper {
            flex: 1;
            height: 22px;
            background: var(--win7-address-bg);
            border: 1px solid #ABADB3;
            border-radius: 2px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            gap: 4px;
            overflow: hidden;
        }

        .address-input-wrapper:focus-within {
            border-color: var(--win7-selected);
            box-shadow: 0 0 0 1px var(--win7-selected);
        }

        .address-breadcrumb {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 12px;
            color: var(--win7-text);
            overflow-x: auto;
            white-space: nowrap;
        }

        .address-breadcrumb::-webkit-scrollbar { display: none; }

        .breadcrumb-item {
            padding: 1px 4px;
            border-radius: 2px;
            cursor: pointer;
            color: #1A5FAA;
            text-decoration: none;
        }

        .breadcrumb-item:hover {
            background: #E8F0FE;
            text-decoration: underline;
        }

        .breadcrumb-item.current {
            color: var(--win7-text);
            cursor: default;
        }

        .breadcrumb-item.current:hover {
            background: none;
            text-decoration: none;
        }

        .breadcrumb-sep {
            color: #888;
            font-size: 10px;
        }

        /* === COMMAND BAR === */
        .command-bar {
            height: 30px;
            background: linear-gradient(180deg, #FAFAFA, #ECECEC);
            border-bottom: 1px solid var(--win7-separator);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            flex-shrink: 0;
        }

        .command-btn {
            font-size: 11px;
            color: var(--win7-text);
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .command-btn:hover {
            background: rgba(51,153,255,0.1);
            text-decoration: underline;
        }

        .command-btn i { font-size: 12px; color: #555; }

        .command-separator {
            width: 1px;
            height: 16px;
            background: var(--win7-separator);
        }

        /* === MAIN CONTENT === */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* === SIDEBAR === */
        .sidebar {
            width: 200px;
            background: var(--win7-sidebar);
            border-right: 1px solid var(--win7-separator);
            overflow-y: auto;
            flex-shrink: 0;
            padding: 4px 0;
        }

        .sidebar::-webkit-scrollbar { width: 8px; }
        .sidebar::-webkit-scrollbar-track { background: transparent; }
        .sidebar::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #C8D4E0, #A8B8C8);
            border-radius: 4px;
            border: 1px solid #98A8B8;
        }

        .sidebar-section {
            margin-bottom: 2px;
        }

        .sidebar-header {
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--win7-text);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .sidebar-header:hover {
            background: rgba(51,153,255,0.08);
        }

        .sidebar-header .chevron {
            font-size: 8px;
            color: #666;
            transition: transform 0.15s;
        }

        .sidebar-header.collapsed .chevron {
            transform: rotate(-90deg);
        }

        .sidebar-items {
            padding: 0;
        }

        .sidebar-items.hidden {
            display: none;
        }

        .sidebar-item {
            padding: 3px 12px 3px 28px;
            font-size: 11px;
            color: var(--win7-text);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-item:hover {
            background: rgba(51,153,255,0.1);
        }

        .sidebar-item.active {
            background: rgba(51,153,255,0.18);
            font-weight: 600;
        }

        .sidebar-item i {
            font-size: 13px;
            width: 16px;
            text-align: center;
            flex-shrink: 0;
        }

        /* === FILE AREA === */
        .file-area {
            flex: 1;
            background: #FFFFFF;
            overflow-y: auto;
            padding: 8px;
            position: relative;
        }

        .file-area::-webkit-scrollbar { width: 14px; }
        .file-area::-webkit-scrollbar-track { background: #F0F0F0; }
        .file-area::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #D4DCE6, #B8C4D0);
            border-radius: 0;
            border: 2px solid #F0F0F0;
        }
        .file-area::-webkit-scrollbar-button {
            display: block;
            height: 14px;
            background: #E4E8EC;
            border: 1px solid #B8C0C8;
        }

        /* Grid View */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 4px;
        }

        .file-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 4px 6px;
            border: 1px solid transparent;
            border-radius: 3px;
            cursor: pointer;
            user-select: none;
            text-align: center;
            transition: none;
        }

        .file-item:hover {
            background: var(--win7-hover);
            border-color: #C8D8E8;
        }

        .file-item.selected {
            background: var(--win7-selected);
            border-color: #2070CC;
        }

        .file-item.selected .file-name {
            color: var(--win7-selected-text);
        }

        .file-icon {
            width: 48px;
            height: 48px;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-icon.folder-icon svg {
            width: 48px;
            height: 48px;
        }

        .file-icon.link-icon {
            font-size: 36px;
            line-height: 48px;
        }

        .file-name {
            font-size: 11px;
            color: var(--win7-text);
            line-height: 1.3;
            word-break: break-word;
            max-width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Details View */
        .file-details {
            width: 100%;
            border-collapse: collapse;
        }

        .file-details thead th {
            background: linear-gradient(180deg, #FAFAFA, #ECECEC);
            border-bottom: 1px solid var(--win7-separator);
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 600;
            text-align: left;
            color: var(--win7-text);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 1;
            user-select: none;
            cursor: pointer;
            border-right: 1px solid var(--win7-separator);
        }

        .file-details thead th:last-child { border-right: none; }

        .file-details thead th:hover {
            background: linear-gradient(180deg, #FFFFFF, #E0EAF4);
        }

        .file-details tbody tr {
            border-bottom: 1px solid #F0F0F0;
            cursor: pointer;
        }

        .file-details tbody tr:hover {
            background: var(--win7-hover);
        }

        .file-details tbody tr.selected {
            background: var(--win7-selected);
        }

        .file-details tbody tr.selected td {
            color: var(--win7-selected-text);
        }

        .file-details td {
            padding: 3px 12px;
            font-size: 11px;
            color: var(--win7-text);
            white-space: nowrap;
            border-right: 1px solid #F0F0F0;
        }

        .file-details td:last-child { border-right: none; }

        .detail-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            margin-right: 6px;
        }

        .detail-icon svg { width: 18px; height: 18px; }
        .detail-icon i { font-size: 14px; }

        /* List View */
        .file-list {
            display: flex;
            flex-direction: column;
        }

        .file-list-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 8px;
            border: 1px solid transparent;
            border-radius: 2px;
            cursor: pointer;
            user-select: none;
        }

        .file-list-item:hover {
            background: var(--win7-hover);
            border-color: #C8D8E8;
        }

        .file-list-item.selected {
            background: var(--win7-selected);
            border-color: #2070CC;
        }

        .file-list-item.selected .file-name {
            color: var(--win7-selected-text);
        }

        .file-list-item .file-icon {
            width: 20px;
            height: 20px;
            margin-bottom: 0;
        }

        .file-list-item .file-icon svg { width: 18px; height: 18px; }
        .file-list-item .file-icon.link-icon { font-size: 14px; line-height: 20px; }

        .file-list-item .file-name {
            font-size: 11px;
            -webkit-line-clamp: 1;
        }

        /* === STATUS BAR === */
        .statusbar {
            height: 24px;
            background: var(--win7-status);
            border-top: 1px solid var(--win7-separator);
            display: flex;
            align-items: center;
            padding: 0 12px;
            font-size: 11px;
            color: var(--win7-text-muted);
            gap: 16px;
            flex-shrink: 0;
        }

        .statusbar-section {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .statusbar-divider {
            width: 1px;
            height: 14px;
            background: var(--win7-separator);
        }

        /* === CONTEXT MENU === */
        .context-menu {
            position: fixed;
            background: #F6F6F6;
            border: 1px solid #868686;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
            padding: 2px 0;
            z-index: 1000;
            min-width: 200px;
            display: none;
            font-size: 11px;
        }

        .context-menu.visible { display: block; }

        .context-item {
            padding: 5px 28px 5px 30px;
            cursor: pointer;
            color: var(--win7-text);
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
            user-select: none;
        }

        .context-item:hover {
            background: var(--win7-selected);
            color: var(--win7-selected-text);
        }

        .context-item.disabled {
            color: #AAA;
            cursor: default;
        }

        .context-item.disabled:hover {
            background: none;
            color: #AAA;
        }

        .context-item .shortcut {
            margin-left: auto;
            color: #888;
            font-size: 10px;
        }

        .context-item:hover .shortcut {
            color: rgba(255,255,255,0.7);
        }

        .context-sep {
            height: 1px;
            background: #D4D4D4;
            margin: 2px 4px;
        }

        .context-item .item-icon {
            position: absolute;
            left: 8px;
            font-size: 12px;
            width: 16px;
            text-align: center;
        }

        .context-item:hover .item-icon { color: white; }

        /* === WINDOWS 7 FOLDER SVG === */
        .win7-folder {
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.2));
        }

        /* === TOAST / NOTIFICATION === */
        .win-toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: linear-gradient(180deg, #F0F4FA, #DCE4F0);
            border: 1px solid #8EAABE;
            border-radius: 3px;
            padding: 12px 16px;
            font-size: 12px;
            color: var(--win7-text);
            box-shadow: 0 4px 16px rgba(0,0,0,0.25);
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            pointer-events: none;
            max-width: 300px;
        }

        .win-toast.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .win-toast i { font-size: 18px; color: #2B579A; }

        /* === VIEW TOGGLE POPUP === */
        .view-popup {
            position: absolute;
            background: #F6F6F6;
            border: 1px solid #868686;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
            padding: 4px 0;
            z-index: 500;
            min-width: 150px;
            display: none;
            font-size: 11px;
        }

        .view-popup.visible { display: block; }

        .view-popup-item {
            padding: 5px 24px 5px 28px;
            cursor: pointer;
            color: var(--win7-text);
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-popup-item:hover {
            background: var(--win7-selected);
            color: var(--win7-selected-text);
        }

        .view-popup-item.active::before {
            content: '✓';
            position: absolute;
            left: 10px;
            font-size: 11px;
        }

        .view-popup-item:hover.active::before { color: white; }

        /* === LOADING BAR === */
        .loading-bar {
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            height: 2px;
            background: transparent;
            z-index: 100;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .loading-bar.active { opacity: 1; }

        .loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -40%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--win7-selected), transparent);
            animation: loadSlide 0.8s ease infinite;
        }

        @keyframes loadSlide {
            to { left: 100%; }
        }

        /* === EMPTY STATE === */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #AAA;
            gap: 8px;
        }

        .empty-state i { font-size: 48px; }
        .empty-state span { font-size: 12px; }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .sidebar { width: 160px; }
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); }
            .address-label { display: none; }
        }

        @media (max-width: 600px) {
            .sidebar { display: none; }
            .command-bar { display: none; }
            body { padding: 4px; }
            .window { height: 95vh; max-height: none; border-radius: 4px; }
        }
    </style>
</head>
<body>

<div class="window" id="explorerWindow">
    <!-- Loading Bar -->
    <div class="loading-bar" id="loadingBar"></div>

    <!-- Title Bar -->
    <div class="titlebar">
        <div class="titlebar-left">
            <svg class="titlebar-icon" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="4" width="14" height="10" rx="1" fill="#F0C846" stroke="#C8A020" stroke-width="0.8"/>
                <path d="M1 5 L1 4.5 Q1 3.5 2 3.5 L5.5 3.5 L7 5 Z" fill="#F0C846" stroke="#C8A020" stroke-width="0.8"/>
            </svg>
            <span class="titlebar-text" id="titleText">Computer</span>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-btn minimize" title="Minimize">
                <svg viewBox="0 0 10 10"><line x1="0" y1="8" x2="10" y2="8"/></svg>
            </button>
            <button class="titlebar-btn maximize" title="Maximize">
                <svg viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" rx="0.5"/></svg>
            </button>
            <button class="titlebar-btn close" title="Close">
                <svg viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/></svg>
            </button>
        </div>
    </div>

    <!-- Nav Toolbar -->
    <div class="nav-toolbar">
        <button class="nav-btn" id="btnBack" disabled title="Back"><i class="fas fa-arrow-left"></i></button>
        <button class="nav-btn" id="btnForward" disabled title="Forward"><i class="fas fa-arrow-right"></i></button>
        <button class="nav-btn" id="btnUp" disabled title="Up"><i class="fas fa-arrow-up"></i></button>
        <div class="nav-separator"></div>
        <button class="nav-btn" title="Organize"><i class="fas fa-layer-group"></i></button>
        <div style="flex:1"></div>

// === STATE ===
let currentPath = 'root';
let historyStack = ['root'];

// === ELEMENTS ===
const fileContainer = document.getElementById('fileContainer');
const fileArea = document.getElementById('fileArea');
const addressBreadcrumb = document.getElementById('addressBreadcrumb');

const btnBack = document.getElementById('btnBack');
const btnForward = document.getElementById('btnForward');
const btnUp = document.getElementById('btnUp');

const statusSelected = document.getElementById('statusSelected');
const contextMenu = document.getElementById('contextMenu');
const viewPopup = document.getElementById('viewPopup');
const btnViews = document.getElementById('btnViews');
const loadingBar = document.getElementById('loadingBar');
const winToast = document.getElementById('winToast');
const toastText = document.getElementById('toastText');

// === FOLDER SVG ===
function folderSVG() {
    return `<svg class="win7-folder" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="folderBack" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#F7D96E"/>
                <stop offset="100%" stop-color="#E8B830"/>
            </linearGradient>
            <linearGradient id="folderFront" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FFE882"/>
                <stop offset="100%" stop-color="#F0C846"/>
            </linearGradient>
        </defs>
        <path d="M2 14 L2 10 Q2 8 4 8 L16 8 L20 12 L44 12 Q46 12 46 14 L46 14 L2 14 Z" fill="url(#folderBack)" stroke="#C8A020" stroke-width="0.8"/>
        <rect x="2" y="14" width="44" height="28" rx="2" fill="url(#folderFront)" stroke="#C8A020" stroke-width="0.8"/>
        <rect x="2" y="14" width="44" height="4" fill="#F7D96E" opacity="0.5"/>
    </svg>`;
}

function folderSVGSmall() {
    return `<svg class="win7-folder" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0.5 5 L0.5 3.5 Q0.5 2.5 1.5 2.5 L5 2.5 L6.5 4 L16.5 4 Q17.5 4 17.5 5 L17.5 5 L0.5 5 Z" fill="#F0C846" stroke="#C8A020" stroke-width="0.5"/>
        <rect x="0.5" y="5" width="17" height="11" rx="1" fill="#F5D456" stroke="#C8A020" stroke-width="0.5"/>
    </svg>`;
}

// === RENDER ===
function renderFiles() {
    const data = directoryData[currentPath];
    if (!data) return;

    fileContainer.innerHTML = '';
    selectedItem = null;
    statusSelected.textContent = '';
    titleText.textContent = data.name;

    if (data.items.length === 0) {
        fileContainer.className = 'empty-state';
        fileContainer.innerHTML = `<i class="fas fa-folder-open"></i><span>This folder is empty</span>`;
        statusItems.textContent = '0 items';
        return;
    }

    statusItems.textContent = `${data.items.length} item${data.items.length > 1 ? 's' : ''}`;

    if (currentView === 'grid') {
        fileContainer.className = 'file-grid';
        data.items.forEach((item, idx) => {
            const el = document.createElement('div');
            el.className = 'file-item';
            el.dataset.index = idx;

            if (item.type === 'folder') {
                el.innerHTML = `
                    <div class="file-icon folder-icon">${folderSVG()}</div>
                    <div class="file-name">${item.name}</div>
                `;
            } else {
                el.innerHTML = `
                    <div class="file-icon link-icon"><i class="${item.icon}" style="color:${item.color};"></i></div>
                    <div class="file-name">${item.name}</div>
                `;
            }

            el.addEventListener('click', (e) => selectItem(el, idx));
            el.addEventListener('dblclick', () => openItem(idx));
            el.addEventListener('contextmenu', (e) => showContextMenu(e, idx));
            fileContainer.appendChild(el);
        });
    } else if (currentView === 'list') {
        fileContainer.className = 'file-list';
        data.items.forEach((item, idx) => {
            const el = document.createElement('div');
            el.className = 'file-list-item';
            el.dataset.index = idx;

            if (item.type === 'folder') {
                el.innerHTML = `
                    <div class="file-icon folder-icon">${folderSVGSmall()}</div>
                    <div class="file-name">${item.name}</div>
                `;
            } else {
                el.innerHTML = `
                    <div class="file-icon link-icon"><i class="${item.icon}" style="color:${item.color};font-size:14px;"></i></div>
                    <div class="file-name">${item.name}</div>
                `;
            }

            el.addEventListener('click', (e) => selectItem(el, idx));
            el.addEventListener('dblclick', () => openItem(idx));
            el.addEventListener('contextmenu', (e) => showContextMenu(e, idx));
            fileContainer.appendChild(el);
        });
    } else if (currentView === 'details') {
        fileContainer.className = '';
        fileContainer.style.display = 'block';
        const table = document.createElement('table');
        table.className = 'file-details';

        let thead = `<thead><tr>
            <th style="width:40%">Name</th>
            <th style="width:25%">Type</th>
            <th style="width:35%">Description</th>
        </tr></thead>`;

        let tbody = '<tbody>';
        data.items.forEach((item, idx) => {
            const typeStr = item.type === 'folder' ? 'File folder' : 'Shortcut';
            const descStr = item.desc || '';
            const iconHtml = item.type === 'folder'
                ? `<span class="detail-icon folder-icon">${folderSVGSmall()}</span>`
                : `<span class="detail-icon"><i class="${item.icon}" style="color:${item.color};"></i></span>`;

            tbody += `<tr data-index="${idx}">
                <td>${iconHtml}${item.name}</td>
                <td>${typeStr}</td>
                <td>${descStr}</td>
            </tr>`;
        });
        tbody += '</tbody>';

        table.innerHTML = thead + tbody;
        fileContainer.appendChild(table);

        table.querySelectorAll('tbody tr').forEach(tr => {
            const idx = parseInt(tr.dataset.index);
            tr.addEventListener('click', (e) => selectItem(tr, idx, true));
            tr.addEventListener('dblclick', () => openItem(idx));
            tr.addEventListener('contextmenu', (e) => showContextMenu(e, idx));
        });
    }

    updateBreadcrumb();
    updateNavButtons();
    updateSidebarActive();
}

function selectItem(el, idx, isRow = false) {
    const container = isRow ? el.closest('table') : fileContainer;
    container.querySelectorAll('.selected').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    selectedItem = idx;

    const data = directoryData[currentPath];
    const item = data.items[idx];
    statusSelected.textContent = `1 item selected`;
}

function openItem(idx) {
    const data = directoryData[currentPath];
    const item = data.items[idx];

    if (item.type === 'folder') {
        navigateTo(item.id);
    } else if (item.type === 'link') {
        window.open(item.url, '_blank');
    }
}

function navigateTo(pathId) {
    if (!directoryData[pathId]) {
        showToast('Folder not found');
        return;
    }

    showLoading(() => {
        currentPath = pathId;
        // Trim forward history
        historyStack = historyStack.slice(0, historyIndex + 1);
        historyStack.push(pathId);
        historyIndex = historyStack.length - 1;
        renderFiles();
    });
}

function goBack() {
    if (historyIndex > 0) {
        historyIndex--;
        showLoading(() => {
            currentPath = historyStack[historyIndex];
            renderFiles();
        });
    }
}

function goForward() {
    if (historyIndex < historyStack.length - 1) {
        historyIndex++;
        showLoading(() => {
            currentPath = historyStack[historyIndex];
            renderFiles();
        });
    }
}

function goUp() {
    const data = directoryData[currentPath];
    if (data.parent) {
        navigateTo(data.parent);
    }
}

function updateNavButtons() {
    btnBack.disabled = historyIndex <= 0;
    btnForward.disabled = historyIndex >= historyStack.length - 1;
    const data = directoryData[currentPath];
    btnUp.disabled = !data.parent;
}

function updateBreadcrumb() {
    const path = buildPath(currentPath);
    let html = '';
    path.forEach((p, i) => {
        if (i > 0) html += `<span class="breadcrumb-sep"><i class="fas fa-chevron-right"></i></span>`;
        const isCurrent = i === path.length - 1;
        html += `<span class="breadcrumb-item${isCurrent ? ' current' : ''}" data-nav="${p.id}">${p.name}</span>`;
    });
    addressBreadcrumb.innerHTML = html;

    addressBreadcrumb.querySelectorAll('.breadcrumb-item:not(.current)').forEach(el => {
        el.addEventListener('click', () => navigateTo(el.dataset.nav));
    });
}

function buildPath(pathId) {
    const path = [];
    let current = pathId;
    while (current) {
        const data = directoryData[current];
        path.unshift({ id: current, name: data.name });
        current = data.parent || null;
    }
    return path;
}

function updateSidebarActive() {
    document.querySelectorAll('.sidebar-item').forEach(item => {
        item.classList.remove('active');
        const nav = item.dataset.nav;
        if (nav === currentPath) {
            item.classList.add('active');
        } else if (nav === 'root' && currentPath === 'root') {
            item.classList.add('active');
        }
    });
}

function showLoading(callback) {
    loadingBar.classList.add('active');
    setTimeout(() => {
        callback();
        loadingBar.classList.remove('active');
    }, 300);
}

function showToast(msg) {
    toastText.textContent = msg;
    winToast.classList.add('show');
    setTimeout(() => winToast.classList.remove('show'), 2500);
}

// === CONTEXT MENU ===
let contextTarget = null;

function showContextMenu(e, idx) {
    e.preventDefault();
    e.stopPropagation();
    contextTarget = idx;

    const data = directoryData[currentPath];
    const item = data.items[idx];

    contextMenu.style.left = e.clientX + 'px';
    contextMenu.style.top = e.clientY + 'px';
    contextMenu.classList.add('visible');

    // Adjust if off screen
    const rect = contextMenu.getBoundingClientRect();
    if (rect.right > window.innerWidth) {
        contextMenu.style.left = (e.clientX - rect.width) + 'px';
    }
    if (rect.bottom > window.innerHeight) {
        contextMenu.style.top = (e.clientY - rect.height) + 'px';
    }
}

function hideContextMenu() {
    contextMenu.classList.remove('visible');
    contextTarget = null;
}

contextMenu.addEventListener('click', (e) => {
    const action = e.target.closest('.context-item')?.dataset.action;
    if (!action || contextTarget === null) return;

    const data = directoryData[currentPath];
    const item = data.items[contextTarget];

    if (action === 'open') {
        openItem(contextTarget);
    } else if (action === 'newtab' && item.url) {
        window.open(item.url, '_blank');
    } else if (action === 'properties') {
        const typeStr = item.type === 'folder' ? 'File folder' : 'Internet Shortcut';
        const sizeStr = item.type === 'folder' ? `${item.items?.length || 0} items` : `${item.url}`;
        showToast(`${item.name} — ${typeStr}${item.url ? ': ' + item.url : ''}`);
    }

    hideContextMenu();
});

document.addEventListener('click', hideContextMenu);
fileArea.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    hideContextMenu();
});

// === VIEW TOGGLE ===
btnViews.addEventListener('click', (e) => {
    e.stopPropagation();
    viewPopup.classList.toggle('visible');
});

document.addEventListener('click', () => {
    viewPopup.classList.remove('visible');
});

viewPopup.addEventListener('click', (e) => {
    const view = e.target.closest('.view-popup-item')?.dataset.view;
    if (!view) return;

    currentView = view;
    viewPopup.querySelectorAll('.view-popup-item').forEach(i => i.classList.remove('active'));
    e.target.closest('.view-popup-item').classList.add('active');
    viewPopup.classList.remove('visible');
    renderFiles();
});

// === SIDEBAR ===
document.querySelectorAll('.sidebar-item[data-nav]').forEach(item => {
    item.addEventListener('click', () => {
        const nav = item.dataset.nav;
        if (nav) navigateTo(nav);
    });
});

document.querySelectorAll('.sidebar-header').forEach(header => {
    header.addEventListener('click', () => {
        header.classList.toggle('collapsed');
        const section = header.nextElementSibling;
        if (section) section.classList.toggle('hidden');
    });
});

// === NAV BUTTONS ===
btnBack.addEventListener('click', goBack);
btnForward.addEventListener('click', goForward);
btnUp.addEventListener('click', goUp);

// === NEW FOLDER ===
document.getElementById('btnNewFolder').addEventListener('click', () => {
    showToast('Cannot create folder in this directory');
});

// === KEYBOARD SHORTCUTS ===
document.addEventListener('keydown', (e) => {
    if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); goBack(); }
    if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); goForward(); }
    if (e.altKey && e.key === 'ArrowUp') { e.preventDefault(); goUp(); }
    if (e.key === 'Enter' && selectedItem !== null) { openItem(selectedItem); }
    if (e.key === 'Backspace') { e.preventDefault(); goBack(); }
    if (e.key === 'Escape') { hideContextMenu(); }
});

// === CLICK EMPTY AREA TO DESELECT ===
fileArea.addEventListener('click', (e) => {
    if (e.target === fileArea || e.target === fileContainer) {
        document.querySelectorAll('.selected').forEach(s => s.classList.remove('selected'));
        selectedItem = null;
        statusSelected.textContent = '';
    }
});

// === CLOSE BUTTON ===
document.querySelector('.titlebar-btn.close').addEventListener('click', () => {
    const win = document.getElementById('explorerWindow');
    win.style.transition = 'all 0.3s ease';
    win.style.transform = 'scale(0.95)';
    win.style.opacity = '0';
    setTimeout(() => {
        win.style.display = 'none';
        document.body.innerHTML = `
            <div style="text-align:center;color:rgba(255,255,255,0.5);font-family:'Segoe UI',sans-serif;font-size:14px;">
                <p style="margin-bottom:8px;">Window closed. Refresh page to reopen.</p>
            </div>`;
    }, 300);
});

// === MINIMIZE ===
document.querySelector('.titlebar-btn.minimize').addEventListener('click', () => {
    const win = document.getElementById('explorerWindow');
    win.style.transition = 'all 0.3s ease';
    win.style.transform = 'translateY(100vh) scale(0.8)';
    win.style.opacity = '0';
    setTimeout(() => {
        win.style.transition = 'all 0.3s ease';
        win.style.transform = '';
        win.style.opacity = '1';
    }, 1500);
});

// === MAXIMIZE ===
let isMaximized = false;
document.querySelector('.titlebar-btn.maximize').addEventListener('click', () => {
    const win = document.getElementById('explorerWindow');
    isMaximized = !isMaximized;
    if (isMaximized) {
        win.style.transition = 'all 0.2s ease';
        win.style.width = '100%';
        win.style.height = '100vh';
        win.style.maxWidth = 'none';
        win.style.maxHeight = 'none';
        win.style.borderRadius = '0';
    } else {
        win.style.transition = 'all 0.2s ease';
        win.style.width = '';
        win.style.height = '';
        win.style.maxWidth = '';
        win.style.maxHeight = '';
        win.style.borderRadius = '';
    }
    setTimeout(() => { win.style.transition = ''; }, 250);
});

// === INIT ===
renderFiles();
</script>

</body>
</html>
